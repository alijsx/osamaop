<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>osama op</title>
<style>
  * { 
    margin:0; 
    padding:0; 
    box-sizing:border-box; 
  }
  
  html, body { 
    width:100%; 
    height:100%; 
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    overflow:hidden; 
  }

  body {
    background: linear-gradient(135deg, #7de2fc 0%, #b9b6e5 100%);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    position: relative;
  }

  canvas {
    display:block;
    width:100%;
    height:100%;
    border-radius:0;
    background: linear-gradient(to bottom, #4facfe, #00f2fe);
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
  }

  #startScreen {
    position:absolute;
    top:0; 
    left:0;
    width:100%; 
    height:100%;
    background: linear-gradient(135deg, rgba(0, 0, 0, 0.85) 0%, rgba(0, 0, 0, 0.7) 100%);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:10;
    text-align:center;
    padding:20px;
    animation: fadeIn 1s ease-in-out;
    backdrop-filter: blur(5px);
  }

  #startScreen h1 {
    font-size:4.5rem;
    color: #fff;
    margin-bottom: 20px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
    animation: bounce 1.5s infinite alternate;
    letter-spacing: 2px;
  }

  #startScreen p {
    font-size:1.5rem;
    color:#fff;
    margin-bottom: 30px;
    max-width: 600px;
    line-height: 1.5;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
  }

  #playBtn {
    padding:18px 60px;
    font-size:1.8rem;
    border-radius:50px;
    border:none;
    cursor:pointer;
    background: linear-gradient(90deg, #ffd700, #ffa500);
    color:#222;
    box-shadow: 0 8px 25px rgba(255, 165, 0, 0.5);
    transition:0.3s;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: 20px;
    position: relative;
    overflow: hidden;
  }

  #playBtn:hover {
    transform: scale(1.05);
    background: linear-gradient(90deg, #ffa500, #ffd700);
    box-shadow: 0 10px 30px rgba(255, 165, 0, 0.7);
  }

  #playBtn:active {
    transform: scale(0.98);
  }

  #introCharacter {
    width:50%;
    max-width:300px;
    height:auto;
    margin-bottom: 40px;
    animation: float 2s infinite alternate;
    filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
  }

  .score-display {
    position: absolute;
    top: 30px;
    left: 30px;
    font-size: 2.5rem;
    color: white;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    z-index: 5;
    background: rgba(0, 0, 0, 0.3);
    padding: 10px 20px;
    border-radius: 15px;
    backdrop-filter: blur(5px);
  }

  .controls-info {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-size: 1.2rem;
    text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
    z-index: 5;
    background: rgba(0, 0, 0, 0.3);
    padding: 10px;
    backdrop-filter: blur(5px);
  }

  .game-over {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 20;
    color: white;
    text-align: center;
    backdrop-filter: blur(5px);
  }

  .game-over h2 {
    font-size: 4rem;
    margin-bottom: 20px;
    color: #ffd700;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.7);
  }

  .game-over p {
    font-size: 2rem;
    margin-bottom: 30px;
  }

  .game-over-images {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .game-over-image {
    width: 150px;
    height: 150px;
    object-fit: contain;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    animation: pulse 2s infinite;
  }

  .restart-btn {
    padding: 15px 50px;
    font-size: 1.5rem;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    background: linear-gradient(90deg, #ff416c, #ff4b2b);
    color: white;
    box-shadow: 0 8px 25px rgba(255, 65, 108, 0.5);
    transition: 0.3s;
    font-weight: bold;
  }

  .restart-btn:hover {
    transform: scale(1.05);
    background: linear-gradient(90deg, #ff4b2b, #ff416c);
    box-shadow: 0 10px 30px rgba(255, 65, 108, 0.7);
  }

  @keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-20px); }
  }

  @keyframes fadeIn {
    0% { opacity:0; }
    100% { opacity:1; }
  }

  @keyframes float {
    0% { transform: translateY(0); }
    100% { transform: translateY(-15px); }
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  @media(max-width:768px){
    #startScreen h1 { font-size:3rem; }
    #startScreen p { font-size:1.2rem; }
    #playBtn { padding:15px 45px; font-size:1.5rem; }
    #introCharacter { width:60%; max-width:250px; }
    .score-display { font-size: 2rem; top: 20px; left: 20px; }
    .controls-info { font-size: 1rem; }
    .game-over-image { width: 220px; height: 120px; }
    .game-over-images { gap: 20px; }
  }

  @media(max-width:480px){
    #startScreen h1 { font-size:2.5rem; }
    #startScreen p { font-size:1rem; }
    #playBtn { padding:12px 35px; font-size:1.3rem; }
    #introCharacter { width:70%; max-width:200px; }
    .score-display { font-size: 1.8rem; top: 15px; left: 15px; padding: 8px 15px; }
    .controls-info { font-size: 0.9rem; bottom: 20px; }
    .game-over-image { width: 100px; height: 100px; }
    .game-over-images { gap: 15px; }
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="score-display">Score: 0</div>
<div class="controls-info">Click or tap to flap | Press Enter to restart</div>

<div id="startScreen">
  <img id="introCharacter" src="images/character.png" alt="Character">
  <h1>osama op</h1>
  <p>Navigate through the banana pipes and avoid obstacles!</p>
  <button id="playBtn">Play Now</button>
</div>

<div class="game-over">
  <h2>💀 Game Over adjust krlo💀</h2>
  <p>Your Score: <span id="finalScore">0</span></p>
  
  <!-- Game Over Images Container -->
  <div class="game-over-images">
    <img class="game-over-image" src="images/gameover1.png" alt="Game Over Image 1">
    <img class="game-over-image" src="images/gameover2.png" alt="Game Over Image 2">
  </div>
  
  <button class="restart-btn">Play Again</button>
</div>

<!-- Audio -->
<audio id="introSound" src="sounds/intro.mp3" loop></audio>
<audio id="flapSound" src="sounds/flap.mp3"></audio>
<audio id="hitSound" src="sounds/hit.mp3"></audio>
<audio id="bgSound" src="sounds/background.mp3" loop></audio>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", ()=>{
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

// Audio
const introSound = document.getElementById("introSound");
const flapSound = document.getElementById("flapSound");
const hitSound = document.getElementById("hitSound");
const bgSound = document.getElementById("bgSound");

// Lower volume
introSound.volume = 0.3;
bgSound.volume = 0.2;

// Load images - using your original paths
const birdImg = new Image();
birdImg.src = "images/character.png"; // Your original path
const bananaImg = new Image();
bananaImg.src = "images/banana.png"; // Your original path

// Game Over images
const gameOverImg1 = new Image();
gameOverImg1.src = "images/gameover1.png";
const gameOverImg2 = new Image();
gameOverImg2.src = "images/gameover2.png";

// Game variables - Made easier and smaller character
let bird = { x:100, y:height/2, w:60, h:60, velocity:0, gravity:0.3 }; // Smaller character size
let pipes = [];
let frame = 0;
let score = 0;
let gameRunning = false;
let gameStarted = false;

// UI Elements
const scoreDisplay = document.querySelector('.score-display');
const gameOverScreen = document.querySelector('.game-over');
const finalScoreDisplay = document.getElementById('finalScore');

// Draw functions
function drawBird(){ 
  ctx.drawImage(birdImg, bird.x, bird.y, bird.w, bird.h); 
}

function drawPipes(){
  pipes.forEach(pipe=>{
    // Save the current context
    ctx.save();
    
    // Draw top pipe - flipped upside down
    ctx.translate(pipe.x + 40, 0); // Move to the center of the pipe
    ctx.scale(1, -1); // Flip vertically
    ctx.drawImage(bananaImg, -40, -pipe.y, 80, pipe.y); // Draw flipped
    
    // Restore context for bottom pipe
    ctx.restore();
    
    // Draw bottom pipe normally
    ctx.drawImage(bananaImg, pipe.x, pipe.y + pipe.gap, 80, height - (pipe.y + pipe.gap));
  });
}

function drawBackground(){
  // Draw gradient background
  const gradient = ctx.createLinearGradient(0, 0, 0, height);
  gradient.addColorStop(0, '#4facfe');
  gradient.addColorStop(1, '#00f2fe');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, width, height);
  
  // Draw some clouds
  ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
  for(let i = 0; i < 5; i++) {
    const x = (frame * 0.5 + i * 200) % (width + 200) - 100;
    const y = 100 + Math.sin(frame * 0.01 + i) * 30;
    drawCloud(x, y, 80);
  }
  
  // Draw ground
  ctx.fillStyle = '#8BC34A';
  ctx.fillRect(0, height - 20, width, 20);
  
  // Draw grass details
  ctx.fillStyle = '#689F38';
  for(let i = 0; i < width; i += 20) {
    ctx.fillRect(i, height - 20, 10, -10);
  }
}

function drawCloud(x, y, size) {
  ctx.beginPath();
  ctx.arc(x, y, size/2, 0, Math.PI * 2);
  ctx.arc(x + size/2, y - size/4, size/2, 0, Math.PI * 2);
  ctx.arc(x + size, y, size/2, 0, Math.PI * 2);
  ctx.fill();
}

// Update game
function update(){
  if(!gameRunning) return;
  frame++;
  bird.velocity += bird.gravity;
  bird.y += bird.velocity;

  // Generate new pipes - made easier with wider gaps and slower generation
  if(frame % 120 === 0){ // Reduced frequency
    let pipeY = Math.random()*(height/2)+150; // Higher minimum gap
    pipes.push({ x: width, y: pipeY, gap:250, width:80, scored: false }); // Wider gap, add scored flag
  }

  // Check collisions
  pipes.forEach(pipe=>{
    pipe.x -=3; // Slower pipe movement
    
    // Score increment - fixed logic
    if(!pipe.scored && pipe.x + pipe.width < bird.x) {
      pipe.scored = true;
      score++;
      scoreDisplay.textContent = `Score: ${score}`;
    }
    
    // Collision detection - made more forgiving
    if(bird.x + bird.w - 15 > pipe.x && bird.x + 15 < pipe.x + pipe.width && 
       (bird.y + 15 < pipe.y || bird.y + bird.h - 15 > pipe.y + pipe.gap)){
      hitSound.play();
      gameRunning=false;
      bgSound.pause();
      showGameOver();
    }
  });

  // Remove off-screen pipes
  pipes = pipes.filter(pipe => pipe.x > -100);
  
  // Check if bird hit the ground or ceiling - made more forgiving
  if(bird.y + bird.h > height - 20 || bird.y < 10){
    hitSound.play();
    gameRunning=false;
    bgSound.pause();
    showGameOver();
  }
}

// Draw frame
function draw(){
  drawBackground();
  drawPipes();
  drawBird();
}

// Game loop
function loop(){ 
  update(); 
  draw(); 
  requestAnimationFrame(loop); 
}

function flap(){ 
  if(!gameRunning) return; 
  bird.velocity = -10; // Stronger flap
  flapSound.currentTime = 0; // Reset sound to play from beginning
  flapSound.play(); 
}

function showGameOver(){
  finalScoreDisplay.textContent = score;
  gameOverScreen.style.display = "flex";
}

function restartGame(){
  bird = { x:100, y:height/2, w:60, h:60, velocity:0, gravity:0.3 };
  pipes = [];
  frame = 0;
  score = 0;
  gameRunning = true;
  gameOverScreen.style.display = "none";
  scoreDisplay.textContent = `Score: ${score}`;
  bgSound.currentTime = 0;
  bgSound.play();
}

function startGame(){
  document.getElementById("startScreen").style.display="none";
  introSound.pause();
  bgSound.currentTime = 0;
  bgSound.play();
  gameRunning = true;
  gameStarted = true;
}

// Play intro sound after first interaction
window.addEventListener("click", ()=>{ if(!gameStarted) introSound.play(); }, { once:true });
window.addEventListener("keydown", ()=>{ if(!gameStarted) introSound.play(); }, { once:true });

// Controls
document.getElementById("playBtn").addEventListener("click", startGame);
document.querySelector(".restart-btn").addEventListener("click", restartGame);

window.addEventListener("keydown", e=>{ 
  if(e.code==="Enter" && !gameStarted) startGame();
  if(e.code==="Enter" && !gameRunning && gameStarted) restartGame();
  if(e.code==="Space" && gameRunning) {
    e.preventDefault(); // Prevent space from scrolling the page
    flap();
  }
});

window.addEventListener("click", () => {
  if(gameRunning) flap();
});
window.addEventListener("touchstart", () => {
  if(gameRunning) flap();
});

// Start the game loop
loop();
</script>
</body>
</html>
